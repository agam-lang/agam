name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  coherence-guard:
    name: "Coherence & Literature Citation Guard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run CI Coherence Guard
        run: python scripts/ci_coherence_guard.py

  workspace-test-matrix:
    name: "Test (${{ matrix.os }})"
    needs: coherence-guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Workspace Cargo Check
        run: cargo check --workspace --all-targets
      - name: Workspace Cargo Test
        run: cargo test --workspace
      - name: Cargo Formatting Check
        run: cargo fmt --all -- --check

  miri-ub-verification:
    name: "Miri UB Verification (agam_runtime & agam_ffi)"
    needs: coherence-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Run Miri on agam_runtime (SIMD)
        run: cargo +nightly miri test -p agam_runtime --lib -- simd::tests
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
      - name: Run Miri on agam_runtime (Actors)
        run: cargo +nightly miri test -p agam_runtime --lib -- actor::tests
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
      - name: Run Miri on agam_ffi
        run: cargo +nightly miri test -p agam_ffi --lib
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
