name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coherence-guard:
    name: "Coherence & Literature Citation Guard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run CI Coherence Guard
        run: python scripts/ci_coherence_guard.py

  workspace-test-matrix:
    name: "Test (${{ matrix.os }})"
    needs: coherence-guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Workspace Cargo Check
        run: cargo check --workspace --all-targets
      - name: Workspace Cargo Test
        run: cargo test --workspace
      - name: Cargo Formatting Check
        run: cargo fmt --all -- --check

  miri-ub-verification:
    name: "Miri UB Verification (agam_runtime & agam_ffi)"
    needs: coherence-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Run Miri on agam_runtime (SIMD)
        run: cargo +nightly miri test -p agam_runtime --lib -- simd::tests
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
      - name: Run Miri on agam_runtime (Actors)
        run: cargo +nightly miri test -p agam_runtime --lib -- actor::tests
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
      - name: Run Miri on agam_ffi
        run: cargo +nightly miri test -p agam_ffi --lib
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"

  gui-headless-matrix:
    name: "GUI Headless (${{ matrix.os }})"
    needs: coherence-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            headless: true
          - os: macos-latest
            headless: false
          - os: windows-latest
            headless: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Linux: install Xvfb + Mesa software Vulkan/OpenGL drivers
      - name: Setup Headless Display (Linux)
        if: matrix.headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers mesa-utils libxkbcommon-x11-0
        shell: bash

      - name: Run GUI Headless Tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          if [ "${{ matrix.headless }}" = "true" ]; then
            xvfb-run -a cargo test -p agam_gui --features headless-test
          else
            cargo test -p agam_gui --features headless-test
          fi
        shell: bash
