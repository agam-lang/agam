name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  coherence-guard:
    name: "Coherence & Unwrap Ratchet Guard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run CI Coherence Guard
        run: python scripts/ci_coherence_guard.py

  build:
    uses: agam-lang/.github/.github/workflows/rust-ci.yml@main
